workflows:
  android-apk:
    name: IDBI-style Banking Demo APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          cd Banking
          flutter pub get
      - name: Create Android platform
        script: |
          cd Banking
          flutter create --platforms=android .
      - name: Set safe demo Android app name
        script: |
          cd Banking
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:label="idbi_style_banking_demo"', 'android:label="IDBI Bank UI Demo"')
          p.write_text(s)
          PY
      - name: Build release APK
        script: |
          cd Banking
          flutter build apk --release
    artifacts:
      - Banking/build/app/outputs/flutter-apk/*.apk
